{{define "timeplan_scripts"}}
<script>
// Timeplanen.
//
// Her laag `signupForClass` og `toggleEventCard` og — sytti liner som
// las `.event-card`, `.signup-button` og `data-event-id`. Ingen av dei
// tri finst i nokon mal lenger: paamelding gjeng gjenom dokka
// (`static/js/dokk.js`), som spør tenaren og skriv svaret paa sida.
// Ingen kalla dei to, so dei to `confirm()`-ane og dei fire
// `alert()`-ane deira — med kvar sin bokmaalsstreng skriven inn i
// skriptet — kunde ingen faa sjaa. Dei er burte.
//
// Det som stend att er dei tvo som malen verkeleg kallar.
(function () {
    "use strict";

    // Vikeveljaren i tittelen.
    window.navigateWeek = function (direction) {
        var ny = {{.WeekOffset}} + direction;
        if (ny < 0) return;
        var url = new URL(window.location);
        url.searchParams.set("week", ny);
        window.location.href = url.toString();
    };

    // Sikti yver vika. Ho stend yver nettet no og ikkje i hovudet, men
    // ho gjer det same: legg valet i adressa og hentar vika paa nytt.
    window.applyFilters = function () {
        var url = new URL(window.location);
        [["teacher", "teacher-filter"], ["class", "class-filter"]].forEach(function (par) {
            var felt = document.getElementById(par[1]);
            if (!felt) return;
            if (felt.value) {
                url.searchParams.set(par[0], felt.value);
            } else {
                url.searchParams.delete(par[0]);
            }
        });
        window.location.href = url.toString();
    };
})();
</script>
{{end}}
