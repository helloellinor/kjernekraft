{{define "payment_methods_container"}}
<section class="content-section">
    <h2 class="section-title">{{t .Lang "payments.payment_methods"}}</h2>

    <div id="payment-methods-container">
        <div class="loading-placeholder">{{t .Lang "payments.loading_payment_methods"}}</div>
    </div>

    {{/* Luft mellom det siste kortet og knappen. Han låg klistra inntil. */}}
    <button type="button" class="btn nyrad" onclick="addPaymentMethod()">
        + {{t .Lang "payments.add_payment_method"}}
    </button>
</section>
{{end}}
