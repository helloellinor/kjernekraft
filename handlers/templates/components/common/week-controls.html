{{define "week_controls"}}
{{/* Styringi paa éi lina: vike fram og attende, og dei tvo filtri.
     Ho stod som eit skjema med merkelappar yver kvart felt og tok
     hundre og femti pikslar av høgdi fyre fyrste timen synte seg. */}}
<div class="week-controls">
    <div class="week-navigation">
        <button class="week-nav-btn" onclick="navigateWeek(-1)" {{if not .CanGoBack}}disabled{{end}}
                aria-label="{{t .Lang "timeplan.prev_week"}}">&lsaquo;</button>
        <input type="number" class="week-input felt-tal" id="week-input" value="{{.WeekNumber}}"
               onchange="jumpToWeek()" min="1" max="53"
               aria-label="{{t .Lang "timeplan.week"}}">
        <button class="week-nav-btn" onclick="navigateWeek(1)"
                aria-label="{{t .Lang "timeplan.next_week_btn"}}">&rsaquo;</button>
    </div>

    <div class="filters">
        <select id="teacher-filter" onchange="applyFilters()" aria-label="{{t .Lang "timeplan.teacher_filter"}}">
            <option value="">{{t .Lang "timeplan.all_teachers"}}</option>
            {{range .Teachers}}
            <option value="{{.}}" {{if eq . $.SelectedTeacher}}selected{{end}}>{{.}}</option>
            {{end}}
        </select>
        <select id="class-filter" onchange="applyFilters()" aria-label="{{t .Lang "timeplan.class_filter"}}">
            <option value="">{{t .Lang "timeplan.all_classes"}}</option>
            {{range .ClassTypes}}
            <option value="{{.}}" {{if eq . $.SelectedClass}}selected{{end}}>{{.}}</option>
            {{end}}
        </select>
    </div>
</div>
{{end}}
