<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 58 73" width="{{ breidd }}" height="{{ hogd }}" aria-hidden="true" focusable="false" style="display: block; overflow: visible">
  <defs>
    <linearGradient id="{{ glasId }}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--glans)"></stop>
      <stop offset="0.26" style="stop-color: color-mix(in srgb, var(--glans) 34%, transparent)"></stop>
      <stop offset="0.54" style="stop-color: transparent"></stop>
    </linearGradient>
  </defs>

  <rect x="7" y="1" width="44" height="13" rx="3" style="{{ faneStil }}"></rect>
  <text x="29" y="8.4" text-anchor="middle" dominant-baseline="central" style="{{ dagStil }}">{{ dag }}</text>

  <rect x="1" y="12" width="56" height="60" rx="4" style="{{ kroppStil }}"></rect>

  <g>
    <sc-for list="{{ indeksar }}" as="i" hint-placeholder-count="12">
      <line x1="29" y1="{{ i.y1 }}" x2="29" y2="18.4" transform="{{ i.rot }}" style="stroke: var(--blekk-svakt); stroke-width: 1; stroke-linecap: round"></line>
    </sc-for>
    <text x="29" y="24.2" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 4.4px; fill: var(--blekk-svakt)">12</text>
    <text x="39.8" y="34" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 4.4px; fill: var(--blekk-svakt)">3</text>
    <text x="29" y="43.8" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 4.4px; fill: var(--blekk-svakt)">6</text>
    <text x="18.2" y="34" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 4.4px; fill: var(--blekk-svakt)">9</text>

    <line x1="29" y1="34" x2="29" y2="19.3" transform="{{ sluttRot }}" style="stroke: var(--merke); stroke-width: 1.25; stroke-linecap: round"></line>
    <line x1="29" y1="34" x2="29" y2="23.9" transform="{{ timeRot }}" style="stroke: var(--blekk); stroke-width: 2.3; stroke-linecap: round"></line>
    <line x1="29" y1="34" x2="29" y2="19.3" transform="{{ minuttRot }}" style="stroke: var(--blekk-lys); stroke-width: 1.25; stroke-linecap: round"></line>
    <path d="{{ kake }}" style="fill: color-mix(in srgb, var(--merke) 32%, transparent)"></path>
    <circle cx="29" cy="34" r="1.5" style="fill: var(--blekk)"></circle>
  </g>

  <rect x="4.5" y="56" width="27" height="12.5" rx="1.8" style="fill: color-mix(in srgb, var(--blekk) 9%, var(--flate))"></rect>
  <text x="18" y="62.4" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 7px; fill: var(--blekk)">{{ klokke }}</text>

  <circle cx="45.5" cy="60.5" r="8" style="fill: var(--flate); stroke: var(--kant); stroke-width: 1"></circle>
  <sc-if value="{{ ikkjeFull }}" hint-placeholder-val="{{ true }}">
    <text x="45.5" y="60.5" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-tal); font-size: 7px; fill: var(--blekk)">{{ att }}<tspan style="font-size: .82em; fill: var(--blekk-svakt)">/{{ plassar }}</tspan></text>
  </sc-if>
  <sc-if value="{{ full }}">
    <text x="45.5" y="60.5" text-anchor="middle" dominant-baseline="central" style="font-family: var(--skrift-yver); font-stretch: 68%; font-size: 5.4px; letter-spacing: .04em; fill: var(--blekk-svakt)">FULL</text>
  </sc-if>

  <rect x="1" y="12" width="56" height="60" rx="4" fill="url(#{{ glasId }})" style="pointer-events: none"></rect>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:160},&quot;dag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TY&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fraa&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;17:30&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;til&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;18:30&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;att&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;},&quot;plassar&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:18,&quot;tsType&quot;:&quot;number&quot;},&quot;idag&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;paameld&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;full&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;breidd&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:58,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  vinkel(t) {
    const d = String(t || "00:00").split(":");
    const h = Number(d[0]) || 0, m = Number(d[1]) || 0;
    return { time: (h % 12) * 30 + m * 0.5, minutt: m * 6 };
  }

  renderVals() {
    const p = this.props;
    const fraa = p.fraa || "17:30";
    const til = p.til || "18:30";
    const a = this.vinkel(fraa), b = this.vinkel(til);
    const r = 14.7, cx = 29, cy = 34, rad = Math.PI / 180;
    const pt = (deg) => [
      (cx + r * Math.sin(deg * rad)).toFixed(2),
      (cy - r * Math.cos(deg * rad)).toFixed(2)
    ];
    const p1 = pt(a.time), p2 = pt(b.time);
    const stor = ((b.time - a.time + 360) % 360) > 180 ? 1 : 0;
    const idag = p.idag === true || p.idag === "true";
    const full = p.full === true || p.full === "true";
    const paameld = p.paameld === true || p.paameld === "true";
    const breidd = p.breidd || 58;

    return {
      breidd: breidd,
      hogd: Math.round(breidd * 73 / 58),
      glasId: "glas-" + (p.dag || "x") + "-" + fraa.replace(":", ""),
      dag: p.dag || "TY",
      klokke: fraa,
      att: p.att === undefined ? 2 : p.att,
      plassar: p.plassar === undefined ? 18 : p.plassar,
      full: full,
      ikkjeFull: !full,
      faneStil: idag
        ? "fill: var(--merke-svak); stroke: var(--merke); stroke-width: 1"
        : "fill: var(--faneflate); stroke: var(--kant); stroke-width: 1",
      dagStil: "font-family: var(--skrift-yver); font-stretch: 68%; font-size: 7px; letter-spacing: .06em; fill: "
        + (idag ? "var(--merke)" : "var(--blekk-lys)"),
      kroppStil: "fill: var(--flate); stroke: "
        + (paameld ? "var(--merke)" : "var(--kant)")
        + "; stroke-width: " + (paameld ? "1.6" : "1"),
      indeksar: Array.from({ length: 12 }, (_, i) => ({
        y1: (i % 3 === 0) ? 16.4 : 17.2,
        rot: "rotate(" + (i * 30) + " 29 34)"
      })),
      timeRot: "rotate(" + a.time + " 29 34)",
      minuttRot: "rotate(" + a.minutt + " 29 34)",
      sluttRot: "rotate(" + b.time + " 29 34)",
      kake: "M29,34 L" + p1[0] + "," + p1[1] + " A14.7,14.7 0 " + stor + ",1 " + p2[0] + "," + p2[1] + " Z"
    };
  }
}
</script>
</body>
</html>
